name: Export kit

# Public repo: holds NO deploy credentials. Dispatches scaffold's
# export-kit-release.yml, which builds this repo's export kit at this exact
# SHA and ships it to kits.noisedeck.app. See scaffold
# docs/runbook/export-kits.md.

# A kit is released only after the full engine-free suite passes at the same
# SHA: scripts/test with the 1900-variant parameter sweep, which the push gate
# (tests.yml) skips. That run takes several minutes, so the release runs weekly
# and on manual dispatch, never on push. A SHA that already carries a kit tag is
# not released again, because scaffold mints a new version for every dispatch.
# The Unity editor and GPU pixel gates need a licensed host and run there.
on:
  workflow_dispatch:
  schedule:
    - cron: '47 8 * * 1'

permissions: {}

concurrency:
  group: export-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/noisemaker-for-unity-test-cache
          key: unity-test-cache-${{ runner.os }}-${{ hashFiles('scripts/test') }}
      - name: Run the full engine-free test suite
        env:
          NM_TEST_CACHE: ${{ runner.temp }}/noisemaker-for-unity-test-cache
        run: scripts/test

  dispatch:
    if: github.ref == 'refs/heads/main'
    needs: full-suite
    runs-on: ubuntu-latest
    steps:
      - name: Skip a SHA that is already released
        id: released
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          tags=$(git ls-remote --tags "https://github.com/$REPO.git" 'refs/tags/kit-*')
          if printf '%s\n' "$tags" | awk '$2 ~ /\^\{\}$/ { print $1 }' | grep -qx "$SHA"; then
            echo "$SHA already carries a kit tag; nothing to release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint scaffold-dispatch token
        if: steps.released.outputs.released == 'false'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 2959521
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch export-kit-release
        if: steps.released.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run export-kit-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f kit=unity \
            -f sha=${{ github.sha }}
